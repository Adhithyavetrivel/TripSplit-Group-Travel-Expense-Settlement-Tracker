<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Create Trip')}"></head>
<body>

<div class="app-container">
  <!-- Sidebar -->
  <aside th:replace="~{fragments/layout :: sidebar('create-trip', null, ${allTrips})}"></aside>

  <!-- Main Content -->
  <div class="main-wrapper">
    <!-- Topbar -->
    <header th:replace="~{fragments/layout :: topbar(null)}"></header>

    <!-- Body -->
    <main class="content-body" style="max-width: 860px;">
      <div class="page-header">
        <div>
          <h1 class="page-title">Create New Trip</h1>
          <p class="page-subtitle">Start tracking shared expenses with your travel group</p>
        </div>
      </div>

      <div class="card">
        <form onsubmit="submitCreateTrip(event); return false;">
          <div class="card-body">
            <h3 style="font-size: 16px; font-weight: 700; margin-bottom: 16px; color: var(--text-primary);">Trip Details</h3>

            <div class="form-group">
              <label class="form-label">Trip Name *</label>
              <input type="text" name="name" class="form-control" placeholder="e.g. Goa Summer Trip 2026" required>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label class="form-label">Destination</label>
                <input type="text" name="destination" class="form-control" placeholder="e.g. Goa, India">
              </div>
              <div class="form-group">
                <label class="form-label">Description</label>
                <input type="text" name="description" class="form-control" placeholder="e.g. Annual college reunion">
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label class="form-label">Start Date</label>
                <input type="date" name="startDate" class="form-control">
              </div>
              <div class="form-group">
                <label class="form-label">End Date</label>
                <input type="date" name="endDate" class="form-control">
              </div>
            </div>

            <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 24px 0;">

            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px;">
              <div>
                <h3 style="font-size: 16px; font-weight: 700; color: var(--text-primary);">Initial Participants</h3>
                <p style="font-size: 13px; color: var(--text-muted);">Add group members who will share expenses.</p>
              </div>
              <button type="button" class="btn btn-secondary btn-sm" onclick="addParticipantRow()">
                + Add Participant
              </button>
            </div>

            <div id="createParticipantsContainer">
              <!-- Initial Participant 1 -->
              <div class="participant-row form-row" style="margin-bottom: 12px; align-items: flex-end;">
                <div class="form-group" style="margin-bottom: 0;">
                  <label class="form-label">Participant 1 Name *</label>
                  <input type="text" class="form-control part-name" placeholder="e.g. Alice" value="Alice" required>
                </div>
                <div class="form-group" style="margin-bottom: 0; display: flex; gap: 8px;">
                  <div style="flex: 1;">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control part-email" placeholder="alice@example.com" value="alice@example.com">
                  </div>
                  <button type="button" class="btn btn-secondary btn-sm" onclick="this.closest('.participant-row').remove()" style="align-self: flex-end; height: 42px;" title="Remove">✕</button>
                </div>
              </div>

              <!-- Initial Participant 2 -->
              <div class="participant-row form-row" style="margin-bottom: 12px; align-items: flex-end;">
                <div class="form-group" style="margin-bottom: 0;">
                  <label class="form-label">Participant 2 Name *</label>
                  <input type="text" class="form-control part-name" placeholder="e.g. Bob" value="Bob" required>
                </div>
                <div class="form-group" style="margin-bottom: 0; display: flex; gap: 8px;">
                  <div style="flex: 1;">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control part-email" placeholder="bob@example.com" value="bob@example.com">
                  </div>
                  <button type="button" class="btn btn-secondary btn-sm" onclick="this.closest('.participant-row').remove()" style="align-self: flex-end; height: 42px;" title="Remove">✕</button>
                </div>
              </div>
            </div>
          </div>

          <div class="card-header" style="background: #f8fafc; border-top: 1px solid var(--border-color); display: flex; justify-content: flex-end; gap: 12px;">
            <a th:if="${allTrips != null and not #lists.isEmpty(allTrips)}" th:href="@{/dashboard}" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary" style="padding: 10px 24px;">Create Trip →</button>
          </div>
        </form>
      </div>
    </main>
  </div>
</div>

<div id="toastContainer" class="toast-container"></div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
